{% extends "base.html" %}
{% block content %}
<h1>Settings</h1>

<h2 style="font-size:1.2rem;margin-top:2rem">Profile</h2>
<form method="post" action="/ui/settings/profile" enctype="multipart/form-data" class="stack" style="max-width:460px">
  <div>
    <div class="meta">Bio</div>
    <input name="bio" maxlength="280" value="{{ user.bio or '' }}" placeholder="a line about yourself">
  </div>
  <div>
    <div class="meta">Avatar</div>
    <input type="file" name="avatar" accept="image/*">
  </div>
  <div>
    <div class="meta">Backdrop</div>
    <input type="file" name="backdrop" accept="image/*">
  </div>
  <button type="submit">Save</button>
</form>

<h2 style="font-size:1.2rem;margin-top:2.5rem">Username</h2>
{% if can_rename %}
<form method="post" action="/ui/settings/username" class="row" style="max-width:460px">
  <input name="new_handle" maxlength="32" value="{{ user.username }}" autocomplete="off" data-1p-ignore data-lpignore="true" required>
  <button type="submit">Change</button>
</form>
<div class="meta" style="margin-top:.5rem">You may change this once every 90 days.</div>
{% else %}
<div class="empty">You changed your name recently. Next change available in {{ days_left }} days.</div>
{% endif %}
{% endblock %}
