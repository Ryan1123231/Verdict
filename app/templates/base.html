<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}VERDICT{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0c;
      --panel: #131318;
      --panel-hi: #1c1c23;
      --line: #2a2a34;
      --text: #e8e6e3;
      --muted: #8b8794;
      --blood: #8b1a1a;
      --blood-hi: #b52424;
      --gold: #c9a227;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(139,26,26,.18), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(40,20,60,.15), transparent);
      background-attachment: fixed;
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
      margin: 0;
      padding: 0 1rem 4rem;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 680px; margin: 0 auto; }
    nav {
      display: flex; align-items: center; gap: 1.25rem; flex-wrap: wrap;
      padding: 1.25rem 0; margin-bottom: 2rem;
      border-bottom: 1px solid var(--line);
    }
    .brand {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.75rem; letter-spacing: .12em;
      color: var(--text); text-decoration: none; margin-right: auto;
    }
    .brand span { color: var(--blood-hi); }
    nav a { color: var(--muted); text-decoration: none; font-size: .9rem; font-weight: 500; }
    nav a:hover { color: var(--text); }
    .who { color: var(--muted); font-size: .85rem; }
    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.75rem; letter-spacing: .06em; font-weight: 400;
      margin: 0 0 1.5rem;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1rem;
      display: flex; gap: 1rem;
      transition: border-color .15s, transform .15s;
    }
    .card:hover { border-color: #3a3a46; transform: translateY(-1px); }
    .card img { width: 72px; border-radius: 6px; flex-shrink: 0; align-self: flex-start; }
    .card-body { flex: 1; min-width: 0; }
    .title { font-weight: 700; font-size: 1.05rem; }
    .year { color: var(--muted); font-weight: 400; }
    .meta { color: var(--muted); font-size: .85rem; margin-top: .15rem; }
    .review {
      margin-top: .6rem; padding-left: .75rem;
      border-left: 2px solid var(--blood);
      color: #c9c5c0; font-size: .92rem;
    }
    .score {
      display: inline-block; font-family: 'Bebas Neue', sans-serif;
      font-size: 1.4rem; letter-spacing: .04em; color: var(--gold);
    }
    input, select, textarea {
      background: var(--panel-hi); color: var(--text);
      border: 1px solid var(--line); border-radius: 7px;
      padding: .6rem .75rem; font-family: inherit; font-size: .95rem;
      width: 100%; max-width: 100%;
    }
    input:focus, select:focus { outline: none; border-color: var(--blood-hi); }
    input::placeholder { color: #5c5866; }
    button {
      background: var(--blood); color: #fff; border: none; border-radius: 7px;
      padding: .6rem 1.1rem; font-family: inherit; font-size: .9rem; font-weight: 600;
      cursor: pointer; transition: background .15s;
    }
    button:hover { background: var(--blood-hi); }
    button.ghost {
      background: transparent; border: 1px solid var(--line); color: var(--muted);
      padding: .35rem .7rem; font-size: .8rem;
    }
    button.ghost:hover { border-color: var(--blood); color: var(--text); }
    .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
    .row input { flex: 1; min-width: 140px; width: auto; }
    .row button { flex-shrink: 0; }
    .stack > * { margin-bottom: .75rem; }
    .err {
      background: rgba(139,26,26,.15); border: 1px solid var(--blood);
      color: #ff9b9b; padding: .7rem 1rem; border-radius: 7px; margin-bottom: 1.25rem;
      font-size: .9rem;
    }
    .empty {
      color: var(--muted); text-align: center; padding: 3rem 1rem;
      border: 1px dashed var(--line); border-radius: 10px;
    }
    .following { color: var(--muted); font-size: .85rem; margin: 1rem 0 2rem; }
    .following b { color: var(--text); font-weight: 500; }
    form.inline { display: inline; }
    .auth { max-width: 360px; margin: 3rem auto; }
    .tag {
      font-size: .7rem; text-transform: uppercase; letter-spacing: .08em;
      color: var(--muted); border: 1px solid var(--line);
      padding: .1rem .4rem; border-radius: 4px;
    }
    .tabs { display: flex; gap: .4rem; margin-bottom: 1.75rem; flex-wrap: wrap; }
    .tab {
      display: inline-flex; align-items: center; gap: .4rem;
      padding: .45rem .85rem; border-radius: 999px;
      border: 1px solid var(--line); background: var(--panel);
      color: var(--muted); text-decoration: none;
      font-size: .85rem; font-weight: 500;
      transition: all .15s;
    }
    .tab:hover { border-color: #3a3a46; color: var(--text); }
    .tab.on { background: var(--blood); border-color: var(--blood); color: #fff; }
    .tab span { font-size: .75rem; opacity: .7; }
    @media (max-width: 480px) {
      h1 { font-size: 2.1rem; }
      .card img { width: 56px; }
      nav { gap: .9rem; }
    }
  </style>
</head>
<body>
<div class="wrap">
<nav>
  <a class="brand" href="/">VER<span>DICT</span></a>
  {% if user %}
    <a href="/">Feed</a>
    <a href="/search">Search</a>
    <a href="/friends">Friends</a>
    <a href="/me">Mine</a>
    <span class="who">{{ user.username }}</span>
    <form class="inline" method="post" action="/ui/logout">
      <button class="ghost" type="submit">Log out</button>
    </form>
  {% else %}
    <a href="/login">Log in</a>
    <a href="/register">Register</a>
  {% endif %}
</nav>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
{% block content %}{% endblock %}
</div>
</body>
</html>
