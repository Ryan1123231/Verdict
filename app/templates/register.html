{% extends "base.html" %}
{% block content %}
<div class="auth">
  <h1>Register</h1>
  <form method="post" action="/ui/register" class="stack">
    <input name="username" placeholder="username" required maxlength="32">
    <input type="email" name="email" placeholder="email" required>
    <input type="password" name="password" placeholder="password (12+ characters)" required>
    <button type="submit">Create account</button>
  </form>
</div>
{% endblock %}
