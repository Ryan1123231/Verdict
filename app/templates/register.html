{% extends "base.html" %}
{% block content %}
<h1>Register</h1>
<form method="post" action="/ui/register">
  <div><input name="username" placeholder="username" required maxlength="32"></div>
  <div><input type="email" name="email" placeholder="email" required></div>
  <div><input type="password" name="password" placeholder="password (12+ chars)" required></div>
  <button type="submit">Register</button>
</form>
{% endblock %}
