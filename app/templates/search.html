{% extends "base.html" %}
{% block content %}
<h1>Search</h1>
<form method="get" action="/search" class="row">
  <input name="q" value="{{ q or '' }}" placeholder="movie or show" required autofocus>
  <button type="submit">Find</button>
</form>

{% if q and not results %}
  <div class="empty" style="margin-top:1.5rem">No results for "{{ q }}"</div>
{% endif %}

<div style="margin-top:1.5rem">
{% for row in results %}
  <div class="card">
    {% if row.image_url %}<img src="{{ row.image_url }}" alt="">{% endif %}
    <div class="card-body">
      <div class="title">{{ row.title }} <span class="year">{% if row.year %}{{ row.year }}{% endif %}</span></div>
      <div class="meta"><span class="tag">{{ row.type }}</span></div>
      <form method="post" action="/rate" class="row" style="margin-top:.7rem">
        <input type="hidden" name="media_type" value="{{ row.type }}">
        <input type="hidden" name="source_id" value="{{ row.source_id }}">
        <select name="score" style="width:auto;flex:0 0 auto">
          {% for n in range(10, 0, -1) %}<option value="{{ n }}">{{ n }}</option>{% endfor %}
        </select>
        <input name="review" placeholder="say something (optional)" maxlength="2000">
        <button type="submit">Rate</button>
      </form>
    </div>
  </div>
{% endfor %}
</div>
{% endblock %}
